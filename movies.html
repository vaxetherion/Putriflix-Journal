<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Movies</title>
    <link rel="icon" href="src/images/iconpage/netflix.ico" type="image/x-icon"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="src/css/common.css">
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.95);
        }
        .modal-content {
            position: relative;
            margin: 15% auto;
            padding: 0;
            width: 95%;
            max-width: 900px;
        }
        .close {
            color: #fff;
            position: absolute;
            right: 10px;
            top: -50px;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
        }
        .close:hover,
        .close:focus {
            color: #aaa;
            text-decoration: none;
            cursor: pointer;
        }
        
        @media (min-width: 768px) {
            .modal-content {
                margin: 5% auto;
                width: 90%;
            }
            
            .close {
                right: -40px;
                top: -40px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body class="bg-black text-white m-0 p-0 overflow-x-hidden">
    <header class="flex items-center justify-between px-3 md:px-12 py-2 md:py-3 bg-gradient-to-b from-black/90 to-transparent fixed top-0 w-full z-40">
        <div class="flex items-center space-x-3 md:space-x-6">
            <i class="fas fa-bars text-white cursor-pointer md:hidden text-base" onclick="toggleMobileMenu()"></i>
            <img alt="Netflix Logo" class="h-5 md:h-9" src="src/images/iconpage/netflix_logo.png">
            <nav class="hidden md:flex space-x-5 text-sm">
                <a class="text-gray-300 hover:text-white transition" href="index.html">Home</a>
                <a class="text-gray-300 hover:text-white transition" href="series.html">Series</a>
                <a class="text-white hover:text-gray-300 transition" href="movies.html">Movies</a>
                <a class="text-gray-300 hover:text-white transition" href="newsandpopular.html">News & Popular</a>
                <a class="text-gray-300 hover:text-white transition" href="mylist.html">My List</a>
            </nav>
        </div>
        <div class="flex items-center space-x-3 md:space-x-5">
            <div class="relative">
                <i class="fas fa-search text-white cursor-pointer text-base" onclick="toggleSearchNotification()"></i>
                <div class="notification" id="searchNotification" style="min-width: 240px;">
                    <p>gada siapa siapa kecuali aku.me love you ~R</p>
                </div>
            </div>
            <i class="fas fa-bell text-white cursor-pointer text-base" onclick="toggleNotification()"></i>
            <div class="notification" id="notificationMenu" style="min-width: 240px;">
                <p>Semakin Hari Semakin Cantik Sih Kamu</p>
                <p>Aku Cemburu Kamu Post Foto Nanti Ada Yang Suka Kamu</p>
                <p>I Love You Hehe &gt;3</p>
            </div>
            <div class="dropdown">
                <img alt="User Avatar" class="h-5 w-5 md:h-7 md:w-7 rounded cursor-pointer" onclick="toggleDropdown()" src="src/images/iconpage/user_avatar.png">
                <div class="dropdown-content" id="dropdownMenu">
                    <a href="#">Accounts</a>
                    <a href="#">Settings</a>
                    <a href="#">Logout</a>
                </div>
            </div>
        </div>
    </header>
    <div class="dropdown md:hidden fixed top-11 left-3 z-50">
        <div class="dropdown-content mobile-menu-dropdown" id="mobileMenu">
            <a href="index.html">Home</a>
            <a href="series.html">Series</a>
            <a href="movies.html">Movies</a>
            <a href="newsandpopular.html">News & Popular</a>
            <a href="mylist.html">My List</a>
        </div>
    </div>
    
    <main class="pt-20 md:pt-24 pb-12">
        <section id="moviesSection" class="bg-black py-6 scroll-animate">
            <div class="container mx-auto px-4 md:px-12">
                <h2 class="text-lg md:text-xl font-bold mb-3 md:mb-4">Movies</h2>
                <div id="moviesGrid" class="grid grid-cols-2 md:grid-cols-6 gap-2 md:gap-3"></div>
            </div>
        </section>
    </main>
    
    <div id="movieModals"></div>
    
    <script>
        const movieCount = 7;

        function renderMovies() {
            const grid = document.getElementById('moviesGrid');
            const modals = document.getElementById('movieModals');

            grid.innerHTML = Array.from({ length: movieCount }, (_, index) => {
                const itemNumber = index + 1;
                return `
                    <div class="text-center">
                        <img alt="Thumbnail ${itemNumber}" class="w-full h-auto rounded hover:scale-105 transition-transform duration-300 cursor-pointer" src="src/images/moviespage/placeholder${itemNumber}.png" onclick="openModal('video${itemNumber}')"/>
                    </div>
                `;
            }).join('');

            modals.innerHTML = Array.from({ length: movieCount }, (_, index) => {
                const itemNumber = index + 1;
                return `
                    <div class="modal" id="video${itemNumber}">
                        <div class="modal-content">
                            <span class="close" onclick="closeModal('video${itemNumber}')">&times;</span>
                            <video id="video${itemNumber}-player" controls onended="closeModal('video${itemNumber}')" style="width: 100%; border-radius: 8px;">
                                <source src="src/videos/moviespage/video${itemNumber}.mp4" type="video/mp4"/>
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(videoId) {
            document.getElementById(videoId).style.display = "block";
            var video = document.getElementById(videoId + "-player");
            video.play();
        }

        function closeModal(videoId) {
            var modal = document.getElementById(videoId);
            var video = modal.querySelector("video");
            video.pause();
            video.currentTime = 0;
            modal.style.display = "none";
        }

        function toggleDropdown() {
            var dropdownMenu = document.getElementById("dropdownMenu");
            if (dropdownMenu.classList.contains("show")) {
                dropdownMenu.classList.remove("show");
            } else {
                dropdownMenu.classList.add("show");
            }
        }

        function toggleNotification() {
            var notificationMenu = document.getElementById("notificationMenu");
            if (notificationMenu.style.display === "block") {
                notificationMenu.style.display = "none";
            } else {
                notificationMenu.style.display = "block";
            }
        }

        function toggleSearchNotification() {
            var searchNotification = document.getElementById("searchNotification");
            if (searchNotification.style.display === "block") {
                searchNotification.style.display = "none";
            } else {
                searchNotification.style.display = "block";
            }
        }

        function toggleMobileMenu() {
            var mobileMenu = document.getElementById("mobileMenu");
            if (mobileMenu.classList.contains("show")) {
                mobileMenu.classList.remove("show");
            } else {
                mobileMenu.classList.add("show");
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.cursor-pointer')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
                var notifications = document.getElementsByClassName("notification");
                for (var i = 0; i < notifications.length; i++) {
                    var openNotification = notifications[i];
                    if (openNotification.style.display === "block") {
                        openNotification.style.display = "none";
                    }
                }
                var mobileMenus = document.getElementsByClassName("mobile-menu");
                for (var i = 0; i < mobileMenus.length; i++) {
                    var openMobileMenu = mobileMenus[i];
                    if (openMobileMenu.classList.contains("show")) {
                        openMobileMenu.classList.remove("show");
                    }
                }
            }
        }
        
        function handleScrollAnimation() {
            const section = document.getElementById('moviesSection');
            const rect = section.getBoundingClientRect();
            const isVisible = rect.top < window.innerHeight * 0.85;
            
            if (isVisible) {
                section.classList.add('visible');
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            renderMovies();
            window.addEventListener('scroll', handleScrollAnimation);
            handleScrollAnimation();
        });
    </script>
</body>
</html>
